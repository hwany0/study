name: backend-lab

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lab-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    cpus: 2
    mem_limit: 3g
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lab-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in {1..30}; do
          if /opt/mssql-tools18/bin/sqlcmd -C -S tcp:mssql,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null; then
            echo "MSSQL is accepting connections"
            break
          fi
          if [ "$$i" -eq 30 ]; then
            echo "MSSQL connection failed after 30 attempts"
            exit 1
          fi
          echo "Waiting for MSSQL ($$i/30)..."
          sleep 2
        done
        /opt/mssql-tools18/bin/sqlcmd -C -S tcp:mssql,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID(N'lab') IS NULL CREATE DATABASE lab;" -b
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: lab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: lab-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mssql-data:
  grafana-data:
