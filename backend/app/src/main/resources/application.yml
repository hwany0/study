spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=lab;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10      # Week 1에서 바꿔가며 실험
      pool-name: lab-pool
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

lab:
  seed:
    enabled: true
    product-count: 100000
