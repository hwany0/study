spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lab?rewriteBatchedStatements=true
    username: lab
    password: lab
    hikari:
      maximum-pool-size: 10      # Week 1에서 바꿔가며 실험
      pool-name: lab-pool
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

lab:
  seed:
    enabled: true
    product-count: 100000
